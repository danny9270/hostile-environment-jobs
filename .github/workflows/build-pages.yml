# Rebuilds the per-job pages, sitemap.xml and calendar.ics whenever jobs or courses change, and daily so closed jobs drop off.
name: Build job pages
on:
  push:
    branches: [main]
    paths: [jobs.json, courses.json, index.html, scripts/build_pages.py]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: build-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_pages.py
      - name: Commit changes and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A jobs sitemap.xml 404.html calendar.ics
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild job pages"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with the workflow token don't start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
