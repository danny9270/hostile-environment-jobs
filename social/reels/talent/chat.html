<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
:root{--bg:#111310;--panel:#1a1d19;--ink:#ecebe4;--muted:#a3a79c;--accent:#f29a2e;--line:#2b2f29}
html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"Source Sans 3",sans-serif}
.top{position:absolute;left:0;right:0;top:0;height:300px;background:var(--panel);border-bottom:2px solid var(--line);z-index:5;display:flex;align-items:flex-end;padding:0 56px 34px;gap:28px}
.av{width:110px;height:110px;border-radius:50%;background:#2a2e27;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:"Big Shoulders Display";font-weight:900;font-size:46px;color:var(--accent)}
.gname{font-weight:700;font-size:46px}.gsub{font-size:30px;color:var(--muted);margin-top:4px}
.feed{position:absolute;left:0;right:0;top:300px;bottom:0;overflow:hidden}
.inner{position:absolute;left:0;right:0;top:0;padding:40px 48px 120px}
.msg{display:flex;flex-direction:column;margin:0 0 26px;max-width:820px;transform-origin:left bottom}
.msg.me{margin-left:auto;align-items:flex-end;transform-origin:right bottom}
.who{font-size:28px;font-weight:700;margin:0 0 8px 24px}
.b{font-size:46px;line-height:1.28;padding:26px 34px;border-radius:40px;background:var(--panel);border:2px solid var(--line)}
.msg:not(.me) .b{border-bottom-left-radius:10px}
.me .b{background:var(--accent);color:#16130d;border-color:var(--accent);border-bottom-right-radius:10px;font-weight:600}
.typing .b{display:flex;gap:14px;padding:34px 36px}
.dot{width:20px;height:20px;border-radius:50%;background:var(--muted)}
.card{background:#0c0d0b;border-radius:30px;overflow:hidden;margin-top:6px;border:2px solid #000;width:720px;color:var(--ink)}
.card .ci{height:300px;background:var(--bg);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px;display:flex;flex-direction:column;justify-content:center;padding:0 40px}
.ck{font-family:"IBM Plex Mono";font-size:24px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.ch{font-family:"Big Shoulders Display";font-weight:900;font-size:76px;line-height:.92;text-transform:uppercase;margin-top:12px}
.cu{font-size:30px;color:var(--muted);padding:22px 34px;font-weight:400}
.hook{position:absolute;left:0;right:0;top:300px;z-index:6;padding:40px 56px;background:linear-gradient(rgba(17,19,16,.96),rgba(17,19,16,.85) 70%,transparent)}
.hk{font-family:"IBM Plex Mono";font-size:30px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.hh{font-family:"Big Shoulders Display";font-weight:900;font-size:150px;line-height:.88;text-transform:uppercase;margin-top:14px}
.acc{color:var(--accent)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(-45deg,var(--accent) 0 26px,var(--bg) 26px 52px);z-index:7}
</style></head><body>
<div class="top"><div class="av">EOD</div><div><div class="gname">Lads on the circuit</div><div class="gsub">Gaz, Tommo, Sarah, you</div></div></div>
<div class="feed"><div class="inner" id="in"></div></div>
<div class="hook" id="hook"><div class="hk">Talent pool · Free</div><div class="hh">Between<br><span class="acc">contracts?</span></div></div>
<div class="stripe"></div>
<script>
// [time, who ('me' or name), text or 'CARD']
const M=[
 [0.9,'Gaz','Contract finished Friday. Anyone hiring? 😩'],
 [2.4,'Tommo','Same boat mate. 3 weeks sat at home'],
 [3.9,'me','Get in the H.E. Jobs talent pool'],
 [5.0,'Gaz','The what?'],
 [6.1,'me','Free. Add your trade, quals and the date you\'re free'],
 [7.6,'me','Employers search it. They see your skills, not your name'],
 [9.2,'Sarah','So my old boss won\'t know I\'m looking? 👀'],
 [10.7,'me','Nope. They only get your details if you say yes'],
 [11.9,'me','CARD'],
 [13.2,'Gaz','Doing it now 👊'],
];
const COL={Gaz:'#7fb7e8',Tommo:'#9fd18a',Sarah:'#e59ac0'};
const inner=document.getElementById('in');
const els=M.map(([t,w,x])=>{const d=document.createElement('div');d.className='msg'+(w==='me'?' me':'');
 let h='';if(w!=='me')h+='<div class="who" style="color:'+COL[w]+'">'+w+'</div>';
 if(x==='CARD')h+='<div class="card"><div class="ci"><div class="ck">Hostile Environment Jobs</div><div class="ch">Get found for your<br><span class="acc">next contract</span></div></div><div class="cu">hostileenvironmentjobs.com/candidates</div></div>';
 else h+='<div class="b">'+x+'</div>';d.innerHTML=h;inner.appendChild(d);return d;});
const typ=document.createElement('div');typ.className='msg typing';typ.innerHTML='<div class="b"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';inner.appendChild(typ);
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const back=x=>{x=Math.min(1,Math.max(0,x));const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function render(t){
 els.forEach((e,i)=>{const t0=M[i][0];const on=t>=t0;e.style.display=on?'flex':'none';const k=back((t-t0)/.28);e.style.transform='scale('+(on?(.6+.4*k):1)+')';e.style.opacity=on?Math.min(1,(t-t0)/.12):0;});
 // typing indicator before next non-me message
 let show=false;for(let i=0;i<M.length;i++){if(M[i][1]!=='me'&&t>=M[i][0]-.8&&t<M[i][0]){show=true;}}
 typ.style.display=show?'flex':'none';inner.appendChild(typ);
 const dots=typ.querySelectorAll('.dot');dots.forEach((d,j)=>d.style.transform='translateY('+(-10*Math.max(0,Math.sin(t*9-j*.9)))+'px)');
 // scroll so bottom visible
 const feedH=1620;const h=inner.scrollHeight;const target=Math.max(0,h-feedH);
 window._y=(window._y===undefined)?target:window._y+(target-window._y)*.35;inner.style.transform='translateY('+(-window._y)+'px)';
 const hk=document.getElementById('hook');const ho=t<2.6?1:Math.max(0,1-(t-2.6)/.35);hk.style.opacity=ho;hk.style.transform='translateY('+(-40*(1-ho))+'px)';
}
window.addEventListener('load',()=>render(0));
</script></body></html>
